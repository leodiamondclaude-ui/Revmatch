name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, database tests, build, smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Database tests (real migrations on in-process Postgres)
        run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Smoke tests (signed-out pages, no database)
        run: npx playwright test e2e/smoke.spec.ts --trace off
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-report
          path: playwright-report
          retention-days: 7

  full:
    name: Full browser flow on a local Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start Supabase and apply every migration
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
      - name: Point the app at it
        run: |
          eval "$(supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3100"
          } > .env.local
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Sign up, invite, post, like, notify, report, block, export
        run: npx playwright test --project=desktop --trace off
        env:
          E2E_FULL: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: full-report
          path: playwright-report
          retention-days: 7
